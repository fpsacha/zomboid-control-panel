name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Nothing CodeQL scans. Not a required check, so a skipped run blocks
    # no merge; main and the weekly schedule still analyze everything.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'Screenshots/**'
  schedule:
    - cron: '23 3 * * 1'

# A new push to a pull request supersedes its running analysis. Pushes to
# main and the schedule are never cancelled mid-run; a newer one may replace
# one still waiting.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: javascript-typescript
          queries: security-extended
          packs: codeql/javascript-queries:AlertSuppression.ql

      - name: Analyze
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: /language:javascript-typescript
