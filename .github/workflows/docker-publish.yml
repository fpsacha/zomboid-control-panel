name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # What the root Dockerfile copies, plus the checks this job runs. A main
    # commit that only touches docs or other workflows would rebuild both
    # architectures into the same image. Every release tag still publishes:
    # GitHub doesn't evaluate path filters for tag pushes, and a release
    # commit bumps package.json anyway.
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/entrypoint.sh'
      - 'docker/healthcheck.cjs'
      - 'server/**'
      - 'client/**'
      - 'pz-mod/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-package-version.mjs'
      - '.github/workflows/docker-publish.yml'
  # Pull requests that change what goes into the image build it for both
  # architectures without logging in or pushing, so a Dockerfile or
  # dependency change is proven before it reaches main.
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/entrypoint.sh'
      - 'docker/healthcheck.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'client/package.json'
      - 'client/package-lock.json'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

# Two quick pushes to main (a merge, then its release commit) could build
# side by side, and whichever finished last would set `main` and `edge`,
# even the older commit. Runs for the same ref queue instead (a newer
# pending run replaces an older pending one); a release tag has its own
# group. A pull request's newer push cancels its older build.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reject release tag outside main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag $GITHUB_REF_NAME does not point to a commit on main."
            exit 1
          fi

      - name: Verify existing release points to this tag commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.target_commitish' 2>/dev/null || true)"
          if [ -n "$release_target" ]; then
            release_target_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${release_target}" --jq '.sha')"
            if [ "$release_target_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Existing release ${GITHUB_REF_NAME} targets ${release_target_sha}, but this workflow is building ${GITHUB_SHA}."
              exit 1
            fi
          fi

      - name: Reject manual Docker publication outside main or release tag
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::Manual Docker publication is allowed only from main or a v* release tag."
          exit 1

      - name: Verify package version parity
        run: node scripts/verify-package-version.mjs

      - name: Read package version
        id: package-version
        run: node -e "console.log('version=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"

      - name: Reject stale main Docker version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # A repository with no release yet (a fresh fork) has nothing to
          # compare against. Any other API failure leaves the count empty
          # and still fails at gh release view below.
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" --jq 'length')" = "0" ]; then
            echo "::notice::$GITHUB_REPOSITORY has no releases yet; skipping the latest-release version check."
            exit 0
          fi
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' | sed 's/^v//')"
          node scripts/verify-package-version.mjs --minimum "$latest"

      - name: Verify tag Docker version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/verify-package-version.mjs "${{ github.ref_name }}"

      # `latest` and the <major>.<minor> alias follow the highest release
      # tag. A re-run of an older tag's run, or a manual run on one, still
      # publishes its own version tags but never moves those back.
      - name: Check whether this is the newest release tag
        id: newest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          git tag --list 'v*' | node scripts/newest-release-tag.mjs "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Never on a pull request: a fork's token is read-only, and even a
      # same-repository change must merge before an image is published.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/zomboid-panel
          # `latest` is the newest release, never an unreleased main commit:
          # docker-compose.install.yml, docker-compose.yml and the Unraid
          # template pull it (the installer with pull_policy: always), and a
          # main push can carry a dependency update merged minutes earlier.
          # Main pushes publish `main` and its alias `edge` instead. The
          # flavor's automatic `latest` is off so this list is the only
          # source of that tag.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.newest.outputs.minor == 'true' }}
            type=raw,value=latest,enable=${{ steps.newest.outputs.latest == 'true' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          # Multi-arch again: the Dockerfile now only installs lib32gcc-s1/
          # lib32stdc++6 (steamcmd's 32-bit deps, unavailable for arm64) when
          # dpkg --print-architecture = amd64, so arm64 no longer fails
          # apt-get install — it just can't self-install/run a PZ server via
          # SteamCMD (no arm64 build of that either). The panel itself still
          # works there for remote-administering an amd64 PZ server elsewhere.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          # Pass the commit sha in: the image has no .git and no git binary, so
          # server/index.js cannot shell out for it. Without this the backend
          # reports an unknown build sha, which the frontend/backend
          # compatibility gate then treats as a mismatch.
          build-args: |
            PANEL_BUILD_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.package-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # docker/build-push-action defaults to generating a provenance
          # attestation, which GHCR lists as a bogus extra "unknown/unknown"
          # platform manifest alongside the real amd64/arm64 ones. Disabling
          # it drops that phantom entry; we don't consume SLSA provenance
          # data anywhere, so there's nothing lost.
          provenance: false
