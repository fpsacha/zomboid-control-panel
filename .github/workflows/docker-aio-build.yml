name: Build AIO Docker Image

# CI + publish for docker/all-in-one/Dockerfile (Debian-based: panel +
# SteamCMD + the PZ dedicated server in one image). Deliberately kept as its
# own workflow, independent of docker-publish.yml: that workflow publishes
# the standard panel-only image this repo shares a history with upstream
# (fpsacha/zomboid-control-panel), and must keep working unmodified if/when
# this fork's changes go back upstream as a PR. The AIO image is this fork's
# own addition — publishing it here, under its own tag, on its own trigger
# paths, means it can never affect (or conflict with) the upstream-shared
# build.
#
# Pull requests build both images without publishing. Main publishes moving
# `aio` / `updater` tags, while release tags publish immutable version tags
# consumed by bootstrap.sh. The installer falls back to local builds if a tag
# is still being published or predates this workflow.
#
# amd64-only: the base image (cm2network/steamcmd:root) and SteamCMD itself
# have no arm64 build, so there is no usable arm64 target for this image
# (unlike the panel-only Dockerfile, which supports arm64 for remote-only
# administration).

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'docker/all-in-one/**'
      - 'docker/healthcheck.cjs'
      - 'server/**'
      - 'client/**'
      - 'pz-mod/**'
      - 'browser-extension/**'
      - '.dockerignore'
      - 'scripts/verify-package-version.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docker-aio-build.yml'
  pull_request:
    paths:
      - 'docker/all-in-one/**'
      - 'docker/healthcheck.cjs'
      - 'server/**'
      - 'client/**'
      - 'pz-mod/**'
      - 'browser-extension/**'
      - '.dockerignore'
      - 'scripts/verify-package-version.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/helper-images/Dockerfile'
      - 'scripts/helper-images.mjs'
      - '.github/workflows/docker-aio-build.yml'
  workflow_dispatch:

# A pull request's newer push cancels its older build. Publishing runs on
# main and tags queue instead of overlapping, so an older commit can't
# finish last and leave the moving `aio`/`updater` tags behind.
concurrency:
  group: docker-aio-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reject release tag outside main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag $GITHUB_REF_NAME does not point to a commit on main."
            exit 1
          fi

      - name: Verify existing release points to this tag commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.target_commitish' 2>/dev/null || true)"
          if [ -n "$release_target" ]; then
            release_target_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${release_target}" --jq '.sha')"
            if [ "$release_target_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Existing release ${GITHUB_REF_NAME} targets ${release_target_sha}, but this workflow is building ${GITHUB_SHA}."
              exit 1
            fi
          fi

      - name: Reject manual Docker publication outside main or release tag
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::Manual Docker publication is allowed only from main or a v* release tag."
          exit 1

      - name: Verify package version parity
        run: node scripts/verify-package-version.mjs

      - name: Read package version
        id: package-version
        run: node -e "console.log('version=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"

      - name: Reject stale main Docker version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # A repository with no release yet (a fresh fork) has nothing to
          # compare against. Any other API failure leaves the count empty
          # and still fails at gh release view below.
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" --jq 'length')" = "0" ]; then
            echo "::notice::$GITHUB_REPOSITORY has no releases yet; skipping the latest-release version check."
            exit 0
          fi
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' | sed 's/^v//')"
          node scripts/verify-package-version.mjs --minimum "$latest"

      - name: Verify tag Docker version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/verify-package-version.mjs "$GITHUB_REF_NAME"

      # The BuildKit image pushes with the registry login: by digest from
      # .github/helper-images/Dockerfile, never the action's moving default.
      - name: Read pinned helper images
        id: helpers
        run: node scripts/helper-images.mjs >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=${{ steps.helpers.outputs.buildkit }}

      - name: Extract all-in-one image metadata
        id: panel-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/zomboid-panel
          # metadata-action otherwise creates a moving `latest` tag for the
          # semver source, which would let the AIO image overwrite the
          # panel-only image consumed by the generic Compose installer.
          flavor: latest=false
          tags: |
            type=raw,value=aio,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}},prefix=aio-
            type=sha,format=short,prefix=aio-

      - name: Extract updater image metadata
        id: updater-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/zomboid-panel
          # The updater is published in the shared GHCR package, so it must
          # never claim the package's generic `latest` tag.
          flavor: latest=false
          tags: |
            type=raw,value=updater,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}},prefix=updater-
            type=sha,format=short,prefix=updater-

      # Only log in / push outside pull_request — a PR from a fork gets a
      # read-only GITHUB_TOKEN, and even a same-repo PR shouldn't publish an
      # image before the change has actually merged.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and publish on push/dispatch) AIO image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/all-in-one/Dockerfile
          build-args: |
            PANEL_BUILD_SHA=${{ github.sha }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.panel-meta.outputs.tags }}
          labels: |
            ${{ steps.panel-meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.package-version.outputs.version }}
          cache-from: type=gha,scope=aio
          cache-to: type=gha,mode=max,scope=aio
          # Same reasoning as docker-publish.yml: avoid the phantom
          # "unknown/unknown" provenance manifest on GHCR.
          provenance: false

      - name: Build (and publish on push/dispatch) updater image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/all-in-one/updater/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.updater-meta.outputs.tags }}
          labels: |
            ${{ steps.updater-meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.package-version.outputs.version }}
          cache-from: type=gha,scope=aio-updater
          cache-to: type=gha,mode=max,scope=aio-updater
          provenance: false
