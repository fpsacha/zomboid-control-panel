name: Build AIO Docker Image

# CI + publish for docker/all-in-one/Dockerfile (Debian-based: panel +
# SteamCMD + the PZ dedicated server in one image). Deliberately kept as its
# own workflow, independent of docker-publish.yml: that workflow publishes
# the standard panel-only image this repo shares a history with upstream
# (fpsacha/zomboid-control-panel), and must keep working unmodified if/when
# this fork's changes go back upstream as a PR. The AIO image is this fork's
# own addition — publishing it here, under its own tag, on its own trigger
# paths, means it can never affect (or conflict with) the upstream-shared
# build.
#
# On pull requests this only builds (no GHCR credentials are assumed
# available/writable from a PR context) — that still catches a broken
# Dockerfile before merge. On push to main (or a manual run) it also
# publishes to ghcr.io/<owner>/zomboid-panel:aio, so the AIO stack becomes
# pullable instead of only buildable-from-source via bootstrap.sh:
#   docker pull ghcr.io/lynkes/zomboid-panel:aio
#
# amd64-only: the base image (cm2network/steamcmd:root) and SteamCMD itself
# have no arm64 build, so there is no usable arm64 target for this image
# (unlike the panel-only Dockerfile, which supports arm64 for remote-only
# administration).

on:
  push:
    branches:
      - main
    paths:
      - 'docker/all-in-one/Dockerfile'
      - 'docker/all-in-one/entrypoint.sh'
      - 'server/**'
      - 'client/**'
      - 'pz-mod/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'docker/all-in-one/Dockerfile'
      - 'docker/all-in-one/entrypoint.sh'
      - 'server/**'
      - 'client/**'
      - 'pz-mod/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # github.repository_owner preserves actual case ("Lynkes"), but GHCR
      # (like all Docker registries) requires a lowercase repository name --
      # docker-publish.yml never hits this because it goes through
      # docker/metadata-action, which lowercases automatically; this
      # workflow builds tags directly, so it needs to do that itself.
      - name: Compute tag vars
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Only log in / push outside pull_request — a PR from a fork gets a
      # read-only GITHUB_TOKEN, and even a same-repo PR shouldn't publish an
      # image before the change has actually merged.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and publish on push/dispatch) AIO image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/all-in-one/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/zomboid-panel:aio
            ghcr.io/${{ steps.vars.outputs.owner }}/zomboid-panel:aio-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=aio
          cache-to: type=gha,mode=max,scope=aio
          # Same reasoning as docker-publish.yml: avoid the phantom
          # "unknown/unknown" provenance manifest on GHCR.
          provenance: false
