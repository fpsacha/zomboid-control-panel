name: macOS data-folder rule

# Security sweep 2026-10-05 (W5): Windows and macOS ignore letter case, so a
# 1.4.5 data folder stored as ...\saves\multiplayer is the game's own
# Saves/Multiplayer folder. services/zomboidDataPath.js reads the names a
# folder is listed under and, off Windows, tells two paths lead to the same
# folder by device and inode; utils/serverConfigPath.js compares the real
# paths fs.realpathSync.native() gives (which carry the on-disk letter case
# on Windows and on macOS). The Windows tests job (ci.yml) runs
# dataFolderMapCleanupShapes.test.js for Windows, and only emulates macOS
# there. This runs it on a real Mac, on APFS (case-insensitive by default),
# whenever the rule or that test changes. It runs one file, so it isn't
# part of every pull request's CI.
on:
  push:
    branches: [main]
    paths:
      - server/services/zomboidDataPath.js
      - server/utils/serverConfigPath.js
      - server/utils/zomboidPaths.js
      - server/utils/browseRoots.js
      - server/routes/chunks.js
      - server/routes/serverFiles.js
      - server/tests/dataFolderMapCleanupShapes.test.js
      - .github/workflows/macos-data-folder.yml
  pull_request:
    paths:
      - server/services/zomboidDataPath.js
      - server/utils/serverConfigPath.js
      - server/utils/zomboidPaths.js
      - server/utils/browseRoots.js
      - server/routes/chunks.js
      - server/routes/serverFiles.js
      - server/tests/dataFolderMapCleanupShapes.test.js
      - .github/workflows/macos-data-folder.yml
  # Run by hand on any branch (Actions > Run workflow), e.g. a release branch
  # that touched the rule before its pull request was opened.
  workflow_dispatch:

concurrency:
  group: macos-data-folder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-data-folder:
    name: Data-folder rule on macOS
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # Same install as the ubuntu server jobs (ci.yml explains why it isn't
      # npm ci).
      - name: Install
        run: npm install --no-audit --prefer-offline --include=optional

      # The test runs its other-letter-case half only where the temp folder
      # ignores case; on a case-sensitive volume it would skip that half and
      # pass without testing anything macOS-specific.
      - name: The temp folder ignores letter case
        run: |
          node -e '
            const fs = require("fs"), os = require("os"), path = require("path");
            const dir = fs.mkdtempSync(path.join(os.tmpdir(), "case-probe-"));
            fs.mkdirSync(path.join(dir, "Probe"));
            const ignoresCase = fs.existsSync(path.join(dir, "probe"));
            fs.rmSync(dir, { recursive: true });
            if (!ignoresCase) {
              console.error("::error::The runner temp folder tells letter case apart");
              process.exit(1);
            }
          '

      - name: Tests
        run: npx vitest run server/tests/dataFolderMapCleanupShapes.test.js
