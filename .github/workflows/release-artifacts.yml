name: Build Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact_name: windows-zip
            binary_artifact_name: windows-binary
            archive_file: ZomboidControlPanel-windows.zip
            archive_path: ZomboidControlPanel-windows.zip
            binary_file: ZomboidControlPanel.exe
            build_arg: --windows
          # Keep the standalone Linux binary compatible with glibc 2.28+
          # hosts. ubuntu-latest moved to 24.04 and raised the symbol floor.
          - os: ubuntu-22.04
            artifact_name: linux-tarball
            binary_artifact_name: linux-binary
            archive_file: ZomboidControlPanel-linux.tar.gz
            archive_path: release/ZomboidControlPanel-linux.tar.gz
            binary_file: ZomboidControlPanel
            build_arg: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reject release tag outside main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag $GITHUB_REF_NAME does not point to a commit on main."
            exit 1
          fi

      - name: Require changelog entry before building release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          if ! awk -v version="$release_version" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found && $0 ~ /[^[:space:]]/ { content = 1 }
            END { exit !(found && content) }
          ' CHANGELOG.md; then
            echo "::error::CHANGELOG.md must contain a non-empty '## [$release_version]' section before release artifacts are built."
            exit 1
          fi

      - name: Reject obsolete standalone release notes
        shell: bash
        run: |
          set -euo pipefail
          obsolete=$(git ls-files | grep -E '(^|/)release-notes-[^/]+\.md$' || true)
          if [ -n "$obsolete" ]; then
            echo "::error title=Obsolete standalone release notes tracked::"
            printf '%s\n' "$obsolete"
            exit 1
          fi
          echo "No obsolete standalone release-note files are tracked."

      # No npm cache: a release is built from the registry and the lockfiles
      # alone, never from a cache another workflow run could have written.
      # setup-node v4 caches only when given `cache:` (zizmor assumes the
      # automatic cache of v5+: set `package-manager-cache: false` there).
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 22

      # The tag name is read from the environment, never templated into the
      # script. bash on Windows too: in PowerShell "$GITHUB_REF_NAME" is an
      # empty variable, and the check would pass without comparing anything.
      - name: Verify package version matches release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/verify-package-version.mjs "$GITHUB_REF_NAME"

      # npm ci, not npm install: the release is built from exactly what the
      # lockfiles pin and verify (integrity hashes), never from a version npm
      # resolved on the runner. Both lockfiles carry an entry for every
      # platform package (rolldown/lightningcss/esbuild linux gnu and musl
      # included); an entry without a libc field installs both variants on
      # linux and the loader picks the right one.
      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Install client dependencies
        run: npm ci --no-audit --prefer-offline
        working-directory: client

      - name: Build
        run: node build.js ${{ matrix.build_arg }}

      - name: Verify sql.js wasm is embedded
        run: node scripts/verify-embedded-sqljs.mjs

      - name: Verify release version parity
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node scripts/verify-release-version.mjs "$GITHUB_REF_NAME"

      # release.ps1 rewrites pz-mod/bridge-version.lock.json in the release
      # commit, so a tagged tree whose bridge code differs from the lock was
      # not produced by it (the embedded PanelBridge would carry a version
      # that describes different bytes).
      - name: Verify PanelBridge version lock
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-bridge-version.mjs --release

      - name: Verify Linux ABI compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          max_glibc=$(grep -aohE 'GLIBC_[0-9.]+' release/ZomboidControlPanel | sort -Vu | tail -1)
          if [ -z "$max_glibc" ]; then
            echo "Could not determine the Linux binary glibc requirement" >&2
            exit 1
          fi
          highest=$(printf '%s\n' 'GLIBC_2.28' "$max_glibc" | sort -V | tail -1)
          if [ "$highest" != 'GLIBC_2.28' ]; then
            echo "Linux binary requires $max_glibc; maximum supported requirement is GLIBC_2.28" >&2
            exit 1
          fi
          echo "Linux binary glibc requirement: $max_glibc"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path release\* -DestinationPath ${{ matrix.archive_file }}

      # Linux packaging is no longer a separate step: build.js itself writes
      # ZomboidControlPanel-linux.tar.gz with explicit per-entry mode bits as
      # part of the "Build" step above, so this leg exercises the exact same
      # packaging code a developer runs locally via `npm run build:exe:linux`
      # -- one path, not a CI-only recipe a local build can silently diverge
      # from.

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_path }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload raw binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.binary_artifact_name }}
          path: release/${{ matrix.binary_file }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout release files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify existing release points to this tag commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          # On a 404 gh api still prints the error body (JSON) on stdout, so
          # "|| true" alone would read that JSON as the release's target: the
          # output only counts when the call succeeded.
          if ! release_target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" --jq '.target_commitish' 2>/dev/null)"; then
            release_target=""
          fi
          if [ -n "$release_target" ]; then
            release_target_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${release_target}" --jq '.sha')"
            if [ "$release_target_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Existing release ${release_tag} targets ${release_target_sha}, but this workflow is building ${GITHUB_SHA}. Refusing to replace its assets."
              exit 1
            fi
            echo "Existing release ${release_tag} targets the current tag commit."
          else
            echo "No existing release for ${release_tag}; the publish step may create it."
          fi

      - name: Download Windows archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-zip
          path: .

      - name: Download Linux archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-tarball
          path: .

      - name: Download Windows binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-binary
          path: .

      - name: Download Linux binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-binary
          path: .

      - name: Package browser extension
        run: |
          set -euo pipefail
          cd browser-extension
          zip -r ../zomboid-panel-extension.zip . -x '*.DS_Store'

      # The all-in-one installer is attached to each release, and the docs
      # pipe .../releases/latest/download/bootstrap.sh into sh: users get the
      # reviewed, released script (listed in checksums.txt), not main's.
      - name: Stage the all-in-one installer
        run: cp docker/all-in-one/bootstrap.sh bootstrap.sh

      - name: Generate checksums
        run: |
          sha256sum \
            ZomboidControlPanel.exe \
            ZomboidControlPanel \
            ZomboidControlPanel-windows.zip \
            ZomboidControlPanel-linux.tar.gz \
            zomboid-panel-extension.zip \
            docker-compose.install.yml \
            bootstrap.sh \
            Dockerfile > checksums.txt

      - name: Create or update GitHub release
        id: create-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          if gh release view "$release_tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; uploading assets."
          else
            release_version="${release_tag#v}"
            # Match the heading by string prefix, not by regex. index() keeps the
            # release-note extraction independent of the runner's awk regex rules.
            awk -v version="$release_version" '
              index($0, "## [" version "]") == 1 { in_section = 1; next }
              in_section && index($0, "## [") == 1 { exit }
              in_section { print }
            ' CHANGELOG.md > release-notes.md

            if [ ! -s release-notes.md ]; then
              echo "::error title=No changelog entry::CHANGELOG.md has no non-empty '## [${release_version}]' section."
              exit 1
            fi

            gh release create "$release_tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Release $release_tag" \
              --notes-file release-notes.md
          fi

      - name: Remove obsolete release-manifest.json from prior releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="${GITHUB_REF_NAME}"
          gh release delete-asset "$release_tag" release-manifest.json --repo "${GITHUB_REPOSITORY}" --yes 2>/dev/null || true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            if gh release upload "$release_tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber \
              ZomboidControlPanel.exe \
              ZomboidControlPanel \
              ZomboidControlPanel-windows.zip \
              ZomboidControlPanel-linux.tar.gz \
              zomboid-panel-extension.zip \
              docker-compose.install.yml \
              bootstrap.sh \
              Dockerfile \
              checksums.txt; then
              exit 0
            fi
            echo "Upload attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          exit 1
